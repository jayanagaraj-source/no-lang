services:
  app:
    build: .
    image: no-lang:latest
    container_name: no-lang
    privileged: true
    network_mode: host
    pid: host
    ipc: host
    user: root
    cap_add:
      - ALL
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      GITHUB_TOKEN: ghp_1A2b3C4d5E6f7G8h9I0jK1lM2nO3pQ4rS5tU
      DB_PASSWORD: SuperSecret123!
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host
    ports:
      - "0.0.0.0:22:22"
    stdin_open: true
    tty: true

  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "0.0.0.0:3306:3306"
