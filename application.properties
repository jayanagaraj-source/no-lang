# Spring-style application properties for the no-lang fixture.
# INTENTIONALLY INSECURE - dummy values only.

server.port=8080
server.address=0.0.0.0

# Insecure: TLS disabled
server.ssl.enabled=false

# Insecure: plaintext datasource credentials
spring.datasource.url=jdbc:mysql://db.example.com:3306/app?useSSL=false
spring.datasource.username=root
spring.datasource.password=DummyDbPass123!

# Insecure: every actuator endpoint exposed without auth
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS

# Insecure: verbose errors and debug logging in production
server.error.include-stacktrace=always
logging.level.root=DEBUG
debug=true

# Insecure: session cookie not marked secure / httpOnly
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=false
